<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <style>
      .da-title { font-family: 'Cinzel', 'Times New Roman', Georgia, serif; font-size: 19px; fill: #f3f4f6; letter-spacing: 2px; }
      .da-accent { font-style: italic; font-family: 'Playfair Display', Georgia, serif; fill: #10b981; }
      .da-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 8px; fill: #9ca3af; letter-spacing: 3px; font-weight: 600; }
      .da-compass { stroke: #10b981; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <!-- Compass mark -->
  <circle cx="28" cy="30" r="18" stroke="#1f2937" stroke-width="1.5" fill="#111827"/>
  <circle cx="28" cy="30" r="13" class="da-compass" stroke-dasharray="2,2"/>
  <polygon points="28,17 32,29 28,26 24,29" fill="#10b981"/>
  <polygon points="28,43 32,31 28,34 24,31" fill="#4b5563"/>
  <circle cx="28" cy="30" r="2" fill="#f3f4f6"/>
  <!-- Typography -->
  <text x="56" y="28" class="da-title">DIARIO DE <tspan class="da-accent">ABORDO</tspan></text>
  <text x="56" y="42" class="da-sub">GROWTH · SISTEMAS · LIDERAZGO</text>
</svg>